<style>
  :root{
    --cream:#F7F1E8;
    --ink:#3A2E26;
    --gold:#B08D57;
    --gold-2:#C9A165;
    --night:#2A2128;
    --text:#F1E9DC;
    --line: rgba(241,233,220,.14);
    --surface: rgba(241,233,220,.07);
    --surface-2: rgba(241,233,220,.11);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--night);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    font-size:16px;
    line-height:1.55;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  h1,h2{font-family:'Playfair Display',serif; color:var(--text);}
  em, .mirror{font-family:'Cormorant Garamond',serif; font-style:italic;}
  button, input, textarea{font-family:'Montserrat',sans-serif;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:14px 18px;
    background:rgba(42,33,40,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header .logo{
    width:38px; height:38px; border-radius:50%;
    box-shadow:0 4px 12px rgba(176,141,87,.3);
    object-fit:cover; flex-shrink:0;
  }
  header .titles{flex:1; min-width:0;}
  header h1{font-size:18px; font-weight:600; line-height:1.2;}
  header .estado{font-size:12px; color:var(--gold-2); opacity:.9;}
  header .estado::before{content:'●'; color:#7FBF7F; margin-right:5px; font-size:9px;}
  .btn-salir{
    background:none; border:1px solid var(--line); color:var(--text);
    opacity:.7; font-size:12px; padding:8px 14px; border-radius:100px;
    cursor:pointer; flex-shrink:0;
  }
  .btn-salir:hover, .btn-salir:focus-visible{opacity:1; border-color:var(--gold);}

  /* ---------- Chat ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .estado-carga{
    margin:auto; text-align:center; opacity:.6; font-size:14px;
  }
  .bienvenida{
    text-align:center; padding:28px 12px 8px;
  }
  .bienvenida .luzia-logo{
    width:76px; height:76px; border-radius:50%;
    margin:0 auto 16px;
    box-shadow:0 10px 26px rgba(176,141,87,.3);
    object-fit:cover;
  }
  .bienvenida h2{font-size:clamp(20px,5.5vw,24px); margin-bottom:8px; font-weight:600;}
  .bienvenida p{opacity:.75; font-size:14.5px; max-width:320px; margin:0 auto 22px;}

  .sugerencias{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px;
    scrollbar-width:none;
  }
  .sugerencias::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    padding:10px 16px;
    border-radius:100px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s, border-color .2s;
  }
  .chip:hover, .chip:focus-visible{background:var(--surface-2); border-color:var(--gold);}

  .msg{
    max-width:82%;
    padding:13px 16px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    animation:aparecer .25s ease;
  }
  @keyframes aparecer{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg-usuaria{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--gold), var(--gold-2));
    color:var(--ink);
    border-radius:20px 20px 4px 20px;
    font-weight:500;
  }
  .msg-luzia{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:20px 20px 20px 4px;
  }
  .msg-error{
    align-self:center;
    background:rgba(200,120,90,.14);
    border:1px solid rgba(200,120,90,.35);
    color:#F1E9DC;
    border-radius:14px;
    font-size:13.5px;
    text-align:center;
    max-width:90%;
  }

  .escribiendo{
    align-self:flex-start;
    display:flex; gap:5px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px 20px 20px 4px;
    padding:14px 18px;
  }
  .escribiendo span{
    width:7px; height:7px; border-radius:50%;
    background:var(--gold-2);
    opacity:.5;
    animation:puntito 1.2s infinite ease-in-out;
  }
  .escribiendo span:nth-child(2){animation-delay:.2s;}
  .escribiendo span:nth-child(3){animation-delay:.4s;}
  @keyframes puntito{0%,60%,100%{opacity:.3; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);}}
  @media (prefers-reduced-motion: reduce){
    .msg, .escribiendo span{animation:none;}
  }

  /* ---------- Input ---------- */
  footer{
    position:sticky; bottom:0; z-index:20;
    background:rgba(42,33,40,.96);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  form{display:flex; align-items:flex-end; gap:10px;}
  textarea{
    flex:1;
    resize:none;
    max-height:120px;
    min-height:48px;
    padding:13px 18px;
    border-radius:24px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-size:15px;
    line-height:1.4;
    outline:none;
  }
  textarea::placeholder{color:rgba(241,233,220,.4);}
  textarea:focus{border-color:var(--gold);}
  .btn-enviar{
    width:48px; height:48px; border-radius:50%;
    background:var(--gold);
    border:none;
    color:var(--ink);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s, opacity .2s;
  }
  .btn-enviar:active{transform:scale(.94);}
  .btn-enviar:disabled{opacity:.4; cursor:default;}
  .btn-enviar:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .disclaimer{
    font-size:11px; opacity:.45; text-align:center; margin-top:10px;
  }

  .wa-float{
    position:fixed; bottom:22px; right:22px;
    background:#25D366; color:#fff;
    width:0; height:0; border-radius:50%;
    display:none;
  }

  @media (min-width:640px){
    main{padding-left:calc(50% - 320px + 16px); padding-right:calc(50% - 320px + 16px);}
    header, footer{padding-left:calc(50% - 320px + 18px); padding-right:calc(50% - 320px + 18px);}
  }
</style>
</head>

  async function cargarHistorial(){
    const token = session.access_token;
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/luzia_conversaciones?select=rol,contenido,created_at&order=created_at.asc&limit=200`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${token}`
        }
      }
    );
    if (!res.ok) return [];
    return res.json();
  }

  async function iniciarChat(){
    const { data: { session: s } } = await client.auth.getSession();

    if (!s) {
      window.location.href = 'mi-luzia.html';
      return;
    }
    session = s;

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/luzia_subscribers?email=eq.${encodeURIComponent(s.user.email)}&select=estado`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${s.access_token}`
        }
      }
    );
    const data = await res.json().catch(() => []);
    const activa = data.length > 0 && data[0].estado === 'activo';

    if (!activa) {
      window.location.href = 'mi-luzia.html';
      return;
    }

    estadoTexto.textContent = 'En línea';
    const historial = await cargarHistorial();

    estadoCarga.remove();

    if (historial.length === 0) {
      mostrarBienvenidaConSugerencias();
    } else {
      historial.forEach((m) => {
        chatMain.appendChild(crearBurbuja(m.rol, m.contenido));
      });
    }

    inputMensaje.disabled = false;
    btnEnviar.disabled = false;
    scrollAbajo();
    inputMensaje.focus();
  }

  async function enviarMensaje(texto){
    texto = texto.trim();
    if (!texto || enviando) return;

    const bienvenida = chatMain.querySelector('.bienvenida');
    if (bienvenida) bienvenida.remove();
    const sugerencias = chatMain.querySelector('.sugerencias');
    if (sugerencias) sugerencias.remove();

    enviando = true;
    inputMensaje.value = '';
    inputMensaje.style.height = 'auto';
    btnEnviar.disabled = true;
    inputMensaje.disabled = true;

    chatMain.appendChild(crearBurbuja('usuaria', texto));
    scrollAbajo();
    mostrarEscribiendo();

    try {
      const { data: { session: fresca } } = await client.auth.getSession();
      const token = fresca ? fresca.access_token : session.access_token;

      const res = await fetch('/.netlify/functions/chat-luzia', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ mensaje: texto })
      });

      const data = await res.json().catch(() => ({}));
      quitarEscribiendo();

      if (!res.ok) {
        chatMain.appendChild(crearBurbuja('error', data.error || 'Algo no salió bien. Intenta de nuevo.'));
        if (res.status === 403) {
          setTimeout(() => { window.location.href = 'mi-luzia.html'; }, 2500);
        }
      } else {
        chatMain.appendChild(crearBurbuja('luzia', data.respuesta));
      }
    } catch (err) {
      quitarEscribiendo();
      chatMain.appendChild(crearBurbuja('error', 'No pudimos conectar. Revisa tu internet e intenta de nuevo.'));
    }

    scrollAbajo();
    enviando = false;
    inputMensaje.disabled = false;
    btnEnviar.disabled = false;
    inputMensaje.focus();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    enviarMensaje(inputMensaje.value);
  });

  inputMensaje.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarMensaje(inputMensaje.value);
    }
  });

  inputMensaje.addEventListener('input', () => {
    inputMensaje.style.height = 'auto';
    inputMensaje.style.height = Math.min(inputMensaje.scrollHeight, 120) + 'px';
  });

  btnSalir.addEventListener('click', async () => {
    await client.auth.signOut();
    window.location.href = 'mi-luzia.html';
  });

  iniciarChat();
</script>

</body>
</html>
